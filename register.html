<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | FoodShare 2.0</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">FS</span>FoodShare 2.0</a><div class="nav-links"><a href="index.html">Home</a><a href="login.html">Login</a></div></div></nav>
<main class="container-sm"><form class="card form-card" id="registerForm"><span class="eyebrow">Join the rescue network</span><h1 class="section-title">Create your account</h1><div id="msg"></div><div class="form-grid"><div class="field"><label>Full name / Organization</label><input class="form-control" name="name" required></div><div class="field"><label>Role</label><select class="form-select" name="role" id="role"><option value="donor">Donor</option><option value="volunteer">Volunteer</option><option value="organization">Organization / NGO</option></select></div><div class="field"><label>Email</label><input class="form-control" type="email" name="email" required></div><div class="field"><label>Password</label><input class="form-control" type="password" name="password" minlength="6" required></div><div class="field"><label>Phone</label><input class="form-control" name="phone"></div><div class="field"><label>Address</label><input class="form-control" name="address" placeholder="Area, city"></div><div class="field"><label>Latitude</label><input class="form-control" name="lat" type="number" step="any" value="28.6139"></div><div class="field"><label>Longitude</label><input class="form-control" name="lng" type="number" step="any" value="77.2090"></div><div class="field" id="capacityWrap" hidden><label>Daily capacity (meals)</label><input class="form-control" name="capacity" type="number" value="100"></div></div><div class="btn-row"><button class="btn btn-primary">Register & continue</button></div></form></main>
<script src="js/state.js"></script><script>role.addEventListener('change',()=>capacityWrap.hidden=role.value!=='organization');registerForm.addEventListener('submit',e=>{e.preventDefault();const res=FoodShareState.register(Object.fromEntries(new FormData(e.target)));if(!res.ok){msg.innerHTML=`<div class="alert alert-danger">${res.message}</div>`;return;}location.href=res.redirect;});</script></body></html>
