<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Donations | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="volunteer-dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="volunteer-dashboard.html">Dashboard</a><a class="active" href="available-donations.html">Available</a><a href="my-tasks.html">My Tasks</a><button data-logout>Logout</button></div></div></nav><main class="container section"><h1 class="section-title">Available donations near you</h1><p class="lead">Sorted by priority and recency for fast volunteer action.</p><div class="grid grid-2" id="list"></div></main><script src="js/state.js"></script><script>const user=FoodShareState.requireAuth('volunteer');FoodShareState.decorateShell();function render(){const ds=FoodShareState.donations({status:'available'});list.innerHTML=ds.length?ds.map(d=>`<article class="card donation-card"><div class="split"><div><h3>${FoodShareState.escape(d.title)}</h3><div class="donation-meta"><span>${d.quantity} ${d.unit}</span><span>${FoodShareState.escape(d.foodType)}</span></div></div><span class="badge badge-${d.priority}">${d.priority}</span></div><p>${FoodShareState.escape(d.notes)}</p><div class="donation-meta"><span>📍 ${FoodShareState.escape(d.location)}</span><span>Donor: ${FoodShareState.escape(d.donorName)}</span><span>NGO: ${FoodShareState.escape(d.matchedOrgName||'Auto-match pending')}</span></div><button class="btn btn-primary" onclick="accept('${d.id}')">Accept donation</button></article>`).join(''):'<div class="empty">All clear — no available donations.</div>'}function accept(id){const r=FoodShareState.acceptDonation(id);FoodShareState.toast(r.ok?'Accepted. Added to My Tasks.':r.message,r.ok?'success':'error');render();}render();</script></body></html>
