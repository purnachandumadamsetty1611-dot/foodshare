<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency Requests | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="dashboard.html" data-donor-only>Dashboard</a><a href="volunteer-dashboard.html" data-volunteer-only>Dashboard</a><a class="active" href="emergency-requests.html">Emergencies</a><a href="reports.html">Reports</a><button data-logout>Logout</button></div></div></nav><main class="container section"><div class="grid grid-2"><form class="card" id="form"><span class="eyebrow">Real-time hunger alert</span><h1 class="section-title">Report emergency</h1><div class="field"><label>Location</label><input class="form-control" name="location" required></div><div class="form-grid"><div class="field"><label>People count</label><input class="form-control" name="peopleCount" type="number" min="1" required></div><div class="field"><label>Urgency</label><select class="form-select" name="urgency"><option>Low</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Latitude</label><input class="form-control" name="lat" type="number" step="any" value="28.6139"></div><div class="field"><label>Longitude</label><input class="form-control" name="lng" type="number" step="any" value="77.2090"></div></div><div class="field"><label>Description</label><textarea name="description" required></textarea></div><button class="btn btn-danger">Submit alert</button></form><section><h1 class="section-title">Open alerts</h1><div class="grid" id="list"></div></section></div></main><script src="js/state.js"></script><script>FoodShareState.requireAuth();FoodShareState.decorateShell();function render(){const es=FoodShareState.emergencies();list.innerHTML=es.length?es.map(e=>`<article class="card donation-card"><div class="split"><h3>${FoodShareState.escape(e.location)}</h3><span class="badge ${e.status==='open'?'badge-open':'badge-resolved'}">${e.status}</span></div><div class="donation-meta"><span>${e.peopleCount} people</span><span>${e.urgency}</span><span>${FoodShareState.formatDate(e.createdAt)}</span></div><p>${FoodShareState.escape(e.description)}</p>${e.status==='open'?`<button class="btn btn-sm btn-outline" onclick="closeReq('${e.id}')">Mark resolved</button>`:''}</article>`).join(''):'<div class="empty">No emergency alerts.</div>'}form.onsubmit=e=>{e.preventDefault();const r=FoodShareState.addEmergency(Object.fromEntries(new FormData(form)));FoodShareState.toast(r.ok?'Emergency alert posted':r.message,r.ok?'success':'error');form.reset();render();};function closeReq(id){FoodShareState.closeEmergency(id);render();}render();</script></body></html>
