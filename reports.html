<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="dashboard.html" data-donor-only>Dashboard</a><a href="volunteer-dashboard.html" data-volunteer-only>Dashboard</a><a class="active" href="reports.html">Reports</a><button data-logout>Logout</button></div></div></nav><main class="container section"><span class="eyebrow">CSS-only impact dashboard</span><h1 class="section-title">Reports & impact analytics</h1><div class="grid grid-4" id="stats"></div><br><div class="grid grid-2"><section class="card"><h2>Donation lifecycle</h2><div class="chart-row" id="life"></div></section><section class="card"><h2>Priority pressure</h2><div class="chart-row" id="prio"></div></section></div><br><section class="card"><h2>Recent audit-friendly donation table</h2><div class="table-wrap"><table><thead><tr><th>Food</th><th>Status</th><th>Priority</th><th>Volunteer</th><th>Distributed At</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="js/state.js"></script><script>FoodShareState.requireAuth();FoodShareState.decorateShell();const st=FoodShareState.stats(),ds=FoodShareState.donations();stats.innerHTML=[['Meals served',st.mealsServed],['Total donations',st.donations],['Organizations',st.organizations],['Open emergencies',st.emergencies]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');function bars(el,items){const max=Math.max(1,...items.map(i=>i[1]));el.innerHTML=items.map(([label,val])=>`<div><div class="bar-label"><span>${label}</span><span>${val}</span></div><div class="progress"><span style="width:${val/max*100}%"></span></div></div>`).join('')}bars(life,[['Available',st.available],['Accepted',st.accepted],['Picked',st.picked],['Distributed',st.distributed]]);bars(prio,[['Fresh',ds.filter(d=>d.priority==='Fresh').length],['Urgent',ds.filter(d=>d.priority==='Urgent').length],['Critical',ds.filter(d=>d.priority==='Critical').length]]);rows.innerHTML=ds.slice(0,10).map(d=>`<tr><td>${FoodShareState.escape(d.title)}<br><small>${d.quantity} ${d.unit}</small></td><td>${FoodShareState.statusLabel(d.status)}</td><td><span class="badge badge-${d.priority}">${d.priority}</span></td><td>${FoodShareState.escape(d.acceptedByName||'—')}</td><td>${FoodShareState.formatDate(d.distributedAt)}</td></tr>`).join('');</script></body></html>
