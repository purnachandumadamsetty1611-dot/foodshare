<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | FoodShare 2.0</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body>
<nav class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a data-nav="dashboard" href="dashboard.html">Dashboard</a><a href="add-donation.html">Add Donation</a><a href="view-donations.html">My Donations</a><a href="smart-matching.html">Smart Matching</a><a href="emergency-requests.html">Emergencies</a><a href="reports.html">Reports</a><button data-logout>Logout</button></div></div></nav>
<main class="container section"><span class="eyebrow">Signed in as <span data-user-name></span> · <span data-user-role></span></span><div class="toolbar"><div><h1 class="section-title">Operations dashboard</h1><p class="lead">Monitor active food rescue records and manage your donation pipeline.</p></div><a class="btn btn-primary" href="add-donation.html">+ New Donation</a></div><div class="grid grid-4" id="stats"></div><div class="toolbar"><h2>Recent donations</h2><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="available">Available</button><button class="tab" data-filter="accepted">Accepted</button><button class="tab" data-filter="distributed">Distributed</button></div></div><div class="grid grid-2" id="list"></div></main>
<script src="js/state.js"></script><script>const user=FoodShareState.requireAuth(['donor','organization']);FoodShareState.decorateShell('dashboard');const stat=FoodShareState.stats();stats.innerHTML=[['Active',stat.active],['Available',stat.available],['Critical',stat.critical],['Distributed',stat.distributed]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');let filter='all';function rows(){let ds=user.role==='donor'?FoodShareState.donations({donorId:user.id}):FoodShareState.donations();if(filter!=='all')ds=ds.filter(d=>d.status===filter);list.innerHTML=ds.length?ds.slice(0,8).map(d=>`<article class="card donation-card"><div class="split"><div><h3>${FoodShareState.escape(d.title)}</h3><div class="donation-meta"><span>${d.quantity} ${d.unit}</span><span>•</span><span>${FoodShareState.escape(d.location)}</span></div></div><span class="badge badge-${d.priority}">${d.priority}</span></div><p>${FoodShareState.escape(d.notes||'No notes')}</p><div class="donation-meta"><span class="badge badge-status">${FoodShareState.statusLabel(d.status)}</span><span>Matched: ${FoodShareState.escape(d.matchedOrgName||'Pending')}</span></div><div class="btn-row"><a class="btn btn-sm btn-outline" href="edit-donation.html?id=${d.id}">Edit</a><button class="btn btn-sm btn-danger" onclick="del('${d.id}')">Delete</button></div></article>`).join(''):'<div class="empty">No donations found.</div>'}function del(id){if(confirm('Delete this donation?')){const r=FoodShareState.deleteDonation(id);FoodShareState.toast(r.ok?'Donation deleted':r.message,r.ok?'success':'error');rows();}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;rows();});rows();</script></body></html>
