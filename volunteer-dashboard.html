<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer Dashboard | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="volunteer-dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a data-nav="volunteer" href="volunteer-dashboard.html">Dashboard</a><a href="available-donations.html">Available</a><a href="my-tasks.html">My Tasks</a><a href="emergency-requests.html">Emergencies</a><a href="reports.html">Reports</a><button data-logout>Logout</button></div></div></nav>
<main class="container section"><span class="eyebrow">Volunteer console · <span data-user-name></span></span><div class="toolbar"><div><h1 class="section-title">Pickup mission board</h1><p class="lead">Accept nearby pickups and keep status updated from accepted to distributed.</p></div><a href="available-donations.html" class="btn btn-primary">Find donations</a></div><div class="grid grid-4" id="stats"></div><h2>Suggested urgent pickups</h2><div class="grid grid-2" id="list"></div></main>
<script src="js/state.js"></script><script>const user=FoodShareState.requireAuth('volunteer');FoodShareState.decorateShell('volunteer');const st=FoodShareState.stats(),mine=FoodShareState.donations({acceptedBy:user.id,excludeDistributed:true});stats.innerHTML=[['Available',st.available],['My active tasks',mine.length],['Critical',st.critical],['Open alerts',st.emergencies]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');const ds=FoodShareState.donations({status:'available'}).slice(0,4);list.innerHTML=ds.length?ds.map(d=>`<article class="card donation-card"><div class="split"><h3>${FoodShareState.escape(d.title)}</h3><span class="badge badge-${d.priority}">${d.priority}</span></div><div class="donation-meta"><span>${d.quantity} ${d.unit}</span><span>${FoodShareState.escape(d.location)}</span></div><p>${FoodShareState.escape(d.notes)}</p><button class="btn btn-primary" onclick="accept('${d.id}')">Accept pickup</button></article>`).join(''):'<div class="empty">No available pickups right now.</div>';function accept(id){const r=FoodShareState.acceptDonation(id);FoodShareState.toast(r.ok?'Task accepted':r.message,r.ok?'success':'error');setTimeout(()=>location.href='my-tasks.html',500)}</script></body></html>
