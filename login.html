<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | FoodShare 2.0</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">FS</span>FoodShare 2.0</a><div class="nav-links"><a href="index.html">Home</a><a href="register.html">Register</a></div></div></nav>
<main class="container-sm"><form class="card form-card" id="loginForm"><span class="eyebrow">Secure mock session</span><h1 class="section-title">Welcome back</h1><p class="lead">Demo credentials: donor@foodshare.test / donor123, volunteer@foodshare.test / volunteer123, ngo@foodshare.test / ngo123</p><div id="msg"></div><div class="field"><label>Email</label><input class="form-control" type="email" name="email" required></div><br><div class="field"><label>Password</label><input class="form-control" type="password" name="password" required></div><div class="btn-row"><button class="btn btn-primary" type="submit">Login</button><a class="btn btn-outline" href="register.html">Create account</a></div></form></main>
<script src="js/state.js"></script><script>const current=FoodShareState.getActiveUser();if(current) location.href=FoodShareState.userDashboard(current.role);document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));const res=FoodShareState.login(fd.email,fd.password);if(!res.ok){msg.innerHTML=`<div class="alert alert-danger">${res.message}</div>`;return;}const next=new URLSearchParams(location.search).get('next');location.href=next||res.redirect;});</script></body></html>
