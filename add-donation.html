<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Donation | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="add-donation.html">Add Donation</a><a href="view-donations.html">View Donations</a><button data-logout>Logout</button></div></div></nav>
<main class="container-sm"><form class="card form-card" id="form"><span class="eyebrow">Donation intake</span><h1 class="section-title">Add food donation</h1><p class="lead">Priority updates automatically from cooking/preparation time.</p><div class="alert alert-success">Calculated priority: <b id="priority">Fresh</b></div><div class="form-grid"><div class="field"><label>Food title</label><input class="form-control" name="title" required></div><div class="field"><label>Food type</label><select class="form-select" name="foodType"><option>Cooked Meals</option><option>Fresh Produce</option><option>Bakery</option><option>Packaged Food</option></select></div><div class="field"><label>Quantity</label><input class="form-control" name="quantity" type="number" min="1" required></div><div class="field"><label>Unit</label><select class="form-select" name="unit"><option>servings</option><option>kg</option><option>pieces</option><option>boxes</option></select></div><div class="field"><label>Cooked / prepared at</label><input class="form-control" name="cookedAt" id="cookedAt" type="datetime-local" required></div><div class="field"><label>Expiry window hours</label><input class="form-control" name="expiryHours" type="number" value="12"></div><div class="field"><label>Latitude</label><input class="form-control" name="lat" type="number" step="any"></div><div class="field"><label>Longitude</label><input class="form-control" name="lng" type="number" step="any"></div></div><div class="field"><label>Pickup location</label><input class="form-control" name="location" required></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><div class="btn-row"><button class="btn btn-primary">Submit donation</button><a class="btn btn-outline" href="dashboard.html">Cancel</a></div></form></main>
<script src="js/state.js"></script><script>const user=FoodShareState.requireAuth(['donor','organization']);FoodShareState.decorateShell();function toLocal(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}cookedAt.value=toLocal(new Date());function updateP(){priority.textContent=FoodShareState.calculatePriority(new Date(cookedAt.value).toISOString());priority.className='badge badge-'+priority.textContent}cookedAt.onchange=updateP;updateP();form.lat.value=user.lat;form.lng.value=user.lng;form.addEventListener('submit',e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(form));fd.cookedAt=new Date(fd.cookedAt).toISOString();const r=FoodShareState.addDonation(fd);if(!r.ok) return FoodShareState.toast(r.message,'error');FoodShareState.toast('Donation added');setTimeout(()=>location.href='view-donations.html',600);});</script></body></html>
