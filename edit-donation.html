<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Donation | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="view-donations.html">View Donations</a><button data-logout>Logout</button></div></div></nav><main class="container-sm"><form class="card form-card" id="form"><span class="eyebrow">Edit by URL query id</span><h1 class="section-title">Edit donation</h1><div id="msg"></div><input name="id" type="hidden"><div class="form-grid"><div class="field"><label>Title</label><input class="form-control" name="title" required></div><div class="field"><label>Type</label><select class="form-select" name="foodType"><option>Cooked Meals</option><option>Fresh Produce</option><option>Bakery</option><option>Packaged Food</option></select></div><div class="field"><label>Quantity</label><input class="form-control" name="quantity" type="number"></div><div class="field"><label>Unit</label><input class="form-control" name="unit"></div><div class="field"><label>Cooked at</label><input class="form-control" id="cookedAt" name="cookedAt" type="datetime-local"></div><div class="field"><label>Expiry hours</label><input class="form-control" name="expiryHours" type="number"></div><div class="field"><label>Lat</label><input class="form-control" name="lat" type="number" step="any"></div><div class="field"><label>Lng</label><input class="form-control" name="lng" type="number" step="any"></div></div><div class="field"><label>Location</label><input class="form-control" name="location"></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><p>Priority: <span id="priority" class="badge"></span></p><div class="btn-row"><button class="btn btn-primary">Save changes</button><a class="btn btn-outline" href="view-donations.html">Back</a></div></form></main><script src="js/state.js"></script><script>const user=FoodShareState.requireAuth(['donor','organization']);FoodShareState.decorateShell();const id=new URLSearchParams(location.search).get('id');const d=FoodShareState.getDonation(id);function toLocal(v){const dt=new Date(v);return new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16)}if(!d){form.innerHTML='<div class="empty">Donation not found. Check the ?id= query parameter.</div>'}else{for(const [k,v] of Object.entries(d)){if(form.elements[k])form.elements[k].value=k==='cookedAt'?toLocal(v):v??'';}function p(){const pr=FoodShareState.calculatePriority(new Date(cookedAt.value).toISOString());priority.textContent=pr;priority.className='badge badge-'+pr}cookedAt.onchange=p;p();form.onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(form));fd.cookedAt=new Date(fd.cookedAt).toISOString();const r=FoodShareState.updateDonation(id,fd);FoodShareState.toast(r.ok?'Donation updated':r.message,r.ok?'success':'error');if(r.ok)setTimeout(()=>location.href='view-donations.html',600);}}</script></body></html>
