<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Donations | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="add-donation.html">Add</a><a class="active" href="view-donations.html">Donations</a><a href="reports.html">Reports</a><button data-logout>Logout</button></div></div></nav><main class="container section"><div class="toolbar"><div><h1 class="section-title">Donation records</h1><p class="lead">Dynamic localStorage list filtered by role and status.</p></div><a class="btn btn-primary" href="add-donation.html">+ Add</a></div><div class="tabs" id="tabs"><button class="tab active" data-status="all">All</button><button class="tab" data-status="available">Available</button><button class="tab" data-status="accepted">Accepted</button><button class="tab" data-status="picked">Picked</button><button class="tab" data-status="distributed">Distributed</button></div><br><div class="table-wrap"><table><thead><tr><th>Food</th><th>Priority</th><th>Status</th><th>Location</th><th>Matched NGO</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></main><script src="js/state.js"></script><script>const user=FoodShareState.requireAuth(['donor','organization']);FoodShareState.decorateShell();let status='all';function render(){let ds=user.role==='donor'?FoodShareState.donations({donorId:user.id}):FoodShareState.donations();if(status!=='all')ds=ds.filter(d=>d.status===status);tbody.innerHTML=ds.length?ds.map(d=>`<tr><td><b>${FoodShareState.escape(d.title)}</b><br>${d.quantity} ${d.unit}<br><small>${FoodShareState.formatDate(d.createdAt)}</small></td><td><span class="badge badge-${d.priority}">${d.priority}</span></td><td><span class="badge badge-status">${FoodShareState.statusLabel(d.status)}</span></td><td>${FoodShareState.escape(d.location)}</td><td>${FoodShareState.escape(d.matchedOrgName||'Pending')}</td><td><a class="btn btn-sm btn-outline" href="edit-donation.html?id=${d.id}">Edit</a> <button class="btn btn-sm btn-danger" onclick="del('${d.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No records.</div></td></tr>`}function del(id){if(confirm('Delete donation?')){const r=FoodShareState.deleteDonation(id);FoodShareState.toast(r.ok?'Deleted':r.message,r.ok?'success':'error');render();}}tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;render();});render();</script></body></html>
