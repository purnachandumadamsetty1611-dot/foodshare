<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Matching | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="smart-matching.html">Smart Matching</a><a href="reports.html">Reports</a><button data-logout>Logout</button></div></div></nav><main class="container section"><div class="toolbar"><div><span class="eyebrow">Capacity + Priority + Location</span><h1 class="section-title">Client-side NGO matching</h1><p class="lead">Run the algorithm to assign every active donation to the best organization.</p></div><button class="btn btn-primary" id="run">Run matching</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Donation</th><th>Priority</th><th>Matched NGO</th><th>Distance</th><th>Score</th></tr></thead><tbody id="body"></tbody></table></div></div></main><script src="js/state.js"></script><script>FoodShareState.requireAuth(['donor','organization']);FoodShareState.decorateShell();function render(results){body.innerHTML=results.length?results.map(r=>`<tr><td><b>${FoodShareState.escape(r.title)}</b><br>${r.quantity} meals/items</td><td><span class="badge badge-${r.priority}">${r.priority}</span></td><td>${FoodShareState.escape(r.orgName)}</td><td>${r.distanceKm} km</td><td><b>${r.score}</b><div class="progress"><span style="width:${Math.min(100,r.score)}%"></span></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Click Run matching to compute assignments.</div></td></tr>`}render([]);run.onclick=()=>{const res=FoodShareState.runSmartMatching();FoodShareState.toast(`${res.length} active donations matched`);render(res);};</script></body></html>
