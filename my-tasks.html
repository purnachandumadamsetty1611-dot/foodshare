<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tasks | FoodShare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="volunteer-dashboard.html"><span class="brand-mark">FS</span>FoodShare</a><div class="nav-links"><a href="volunteer-dashboard.html">Dashboard</a><a href="available-donations.html">Available</a><a class="active" href="my-tasks.html">My Tasks</a><button data-logout>Logout</button></div></div></nav><main class="container section"><h1 class="section-title">My accepted pickup tasks</h1><p class="lead">Integrated actions from mark_picked.php and mark_disturbuted.php are implemented here in JS.</p><div class="grid grid-2" id="list"></div></main><script src="js/state.js"></script><script>const user=FoodShareState.requireAuth('volunteer');FoodShareState.decorateShell();function render(){const ds=FoodShareState.donations({acceptedBy:user.id,excludeDistributed:true});list.innerHTML=ds.length?ds.map(d=>`<article class="card donation-card"><div class="split"><h3>${FoodShareState.escape(d.title)}</h3><span class="badge badge-${d.priority}">${d.priority}</span></div><div class="donation-meta"><span>${d.quantity} ${d.unit}</span><span class="badge badge-status">${FoodShareState.statusLabel(d.status)}</span></div><p>Pickup: ${FoodShareState.escape(d.location)}<br>Destination NGO: ${FoodShareState.escape(d.matchedOrgName||'Not assigned')}</p><div class="btn-row">${d.status==='accepted'?`<button class="btn btn-warning" onclick="picked('${d.id}')">Mark picked</button>`:''}${d.status==='picked'?`<button class="btn btn-primary" onclick="done('${d.id}')">Mark distributed</button>`:''}</div></article>`).join(''):'<div class="empty">You have no active tasks. Accept one from Available Donations.</div>'}function picked(id){const r=FoodShareState.markPicked(id);FoodShareState.toast(r.ok?'Pickup marked':r.message,r.ok?'success':'error');render();}function done(id){const r=FoodShareState.markDistributed(id);FoodShareState.toast(r.ok?'Distribution complete':r.message,r.ok?'success':'error');render();}render();</script></body></html>
